name: Emberwatch browser tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run scenario logic tests
        id: unit_tests
        run: npm run test:unit
      - name: Run Playwright browser smoke tests
        id: browser_tests
        if: ${{ success() }}
        run: npm run test:smoke
      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emberwatch-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      # Save outcomes to a separate branch, which cannot retrigger this workflow.
      # Only main-branch pushes publish; fork PRs cannot write results.
      - name: Publish machine-readable test result
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/github-script@v7
        env:
          UNIT_OUTCOME: ${{ steps.unit_tests.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser_tests.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'ci-results';
            const filePath = 'latest.json';
            const result = {
              schema: 1,
              sourceBranch: 'main',
              sourceSha: context.sha,
              runId: context.runId,
              runAttempt: process.env.GITHUB_RUN_ATTEMPT,
              runUrl: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
              unit: process.env.UNIT_OUTCOME || 'unknown',
              browser: process.env.BROWSER_OUTCOME || 'unknown',
              recordedAt: new Date().toISOString()
            };
            result.overall = result.unit === 'success' && result.browser === 'success'
              ? 'success' : 'failure';
            let refExists = true;
            try {
              await github.rest.git.getRef({owner, repo, ref: `heads/${branch}`});
            } catch (error) {
              if (error.status !== 404) throw error;
              refExists = false;
            }
            if (!refExists) {
              try {
                await github.rest.git.createRef({
                  owner, repo, ref: `refs/heads/${branch}`, sha: context.sha
                });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }
            let existingSha;
            try {
              const existing = await github.rest.repos.getContent({
                owner, repo, path: filePath, ref: branch
              });
              existingSha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path: filePath, branch,
              message: `Report CI results for ${context.sha.slice(0, 8)}`,
              content: Buffer.from(JSON.stringify(result, null, 2) + '\\n').toString('base64'),
              ...(existingSha ? {sha: existingSha} : {})
            });
            core.info(JSON.stringify(result));
